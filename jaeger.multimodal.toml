# Isolated Jaeger AI multimodal reference runtime. The product UI attaches its
# face to the native app's one bridge-owned agent; this manifest is used only
# by the explicit `--standalone` benchmark/development mode.

[app]
id = "org.jenkinsrobotics.app.jaeger-ai.multimodal"
name = "jaeger-ai-multimodal-reference"
type = "application"
version = "0.12.0"
requires_framework = ">=0.1"
mode = "fused"
event_loop = "qt"
ui = "pyside6"
single_instance = false
shell_quits_core = true
config = ""

[bus]
backend = "inproc"

[core]
factory = "jaeger_ai.core.agent_core:make_core"
config_key = "agent"

[[surface]]
id = "multimodal"
main = true
factory = "jaeger_ai.interfaces.pyside6.multimodal.window:make_surface"
