# JaegerAI — 100% Standalone Modular Cognitive Platform + Thin Product Composition Root

[tool.uv.workspace]
members = ["packages/*"]
exclude = [
    "packages/jaeger-browser",
    "packages/jaeger-ui-protocol",
    "packages/jaeger-ui-sdk",
    "packages/jaeger-ui-kit",
    "packages/jaeger-ui-avatar",
    "packages/jaeger-ui-features",
]

[tool.uv.sources]
jaeger-authority = { workspace = true }
jaeger-avatar = { workspace = true }
jaeger-business = { workspace = true }
jaeger-channels = { workspace = true }
jaeger-checkpoints = { workspace = true }
jaeger-cognition = { workspace = true }
jaeger-contracts = { workspace = true }
jaeger-droid = { workspace = true }
jaeger-embodiment-minecraft = { workspace = true }
jaeger-evals = { workspace = true }
jaeger-events = { workspace = true }
jaeger-gateway = { workspace = true }
jaeger-hardware = { workspace = true }
jaeger-kokoro-tts = { workspace = true }
jaeger-loop = { workspace = true }
jaeger-lsp = { workspace = true }
jaeger-macos = { workspace = true }
jaeger-mcp = { workspace = true }
jaeger-memory = { workspace = true }
jaeger-models = { workspace = true }
jaeger-orchestration = { workspace = true }
jaeger-protocols = { workspace = true }
jaeger-realtime = { workspace = true }
jaeger-reliability = { workspace = true }
jaeger-skills = { workspace = true }
jaeger-tools = { workspace = true }
jaeger-vision = { workspace = true }
jaeger-whisper-stt = { workspace = true }
jaeger-youtube = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-ai"
description = "JaegerAI: Persistent, local-first modular AI platform (29 standalone Python + 5 React 19 packages)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.10",
    "httpx>=0.27",
    "mcp>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
jaeger = "jaeger_ai.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "jaeger_ai.__version__" }

[tool.setuptools.packages.find]
include = ["jaeger_ai*"]
exclude = ["jaeger_ai.__pycache__", "jaeger_ai.*.__pycache__"]
namespaces = true
