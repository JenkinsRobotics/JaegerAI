# JaegerAI — 100% Standalone Modular Agentic Framework + Thin Product Composition Root

[tool.uv.workspace]
members = ["packages/*"]
exclude = [
    "packages/jaeger-browser",
    "packages/jaeger-ui-protocol",
    "packages/jaeger-ui-sdk",
    "packages/jaeger-ui-kit",
    "packages/jaeger-ui-features",
]

[tool.uv.sources]
jaeger-kokoro-tts = { workspace = true }
jaeger-whisper-stt = { workspace = true }
jaeger-contracts = { workspace = true }
jaeger-authority = { workspace = true }
jaeger-events = { workspace = true }
jaeger-gateway = { workspace = true }
jaeger-loop = { workspace = true }
jaeger-memory = { workspace = true }
jaeger-models = { workspace = true }
jaeger-orchestration = { workspace = true }
jaeger-reliability = { workspace = true }
jaeger-tools = { workspace = true }
jaeger-mcp = { workspace = true }
jaeger-macos = { workspace = true }
jaeger-lsp = { workspace = true }
jaeger-checkpoints = { workspace = true }
jaeger-skills = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-ai"
description = "JaegerAI: Thin product composition root wired onto 15 standalone backend + 4 frontend modular packages"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.10",
    "pydantic>=2.7",
]

[project.scripts]
jaeger = "jaeger_ai.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "jaeger_ai.__version__" }

[tool.setuptools.packages.find]
include = ["jaeger_ai*"]
exclude = ["jaeger_ai.__pycache__", "jaeger_ai.*.__pycache__"]
namespaces = true

[tool.ruff]
cache-dir = "~/.cache/ruff"

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
pythonpath = [
    ".",
    "packages/jaeger-contracts/src",
    "packages/jaeger-events/src",
    "packages/jaeger-gateway/src",
    "packages/jaeger-reliability/src",
    "packages/jaeger-models/src",
    "packages/jaeger-authority/src",
    "packages/jaeger-memory/src",
    "packages/jaeger-tools/src",
    "packages/jaeger-lsp/src",
    "packages/jaeger-checkpoints/src",
    "packages/jaeger-loop/src",
    "packages/jaeger-orchestration/src",
    "packages/jaeger-skills/src",
    "packages/jaeger-mcp/src",
    "packages/jaeger-macos/src",
]
testpaths = ["dev/tests"]
addopts = ["--import-mode=importlib"]
