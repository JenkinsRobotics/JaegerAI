<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARES WorldView</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud">
    <header class="hud-header">
      <div>
        <p class="eyebrow">ARES extension</p>
        <h1>WorldView</h1>
        <p class="sub">Tactical globe sidecar — flights, satellites, ships, quakes</p>
      </div>
      <span class="status" id="statusBadge">CHECKING</span>
    </header>
    <section class="grid">
      <article>
        <h2>Sidecar</h2>
        <p id="healthLine">Probing http://127.0.0.1:3001/api/health</p>
        <pre id="healthJson">…</pre>
      </article>
      <article>
        <h2>Globe UI</h2>
        <p>Vite app is not bundled into this tab yet. After <code>npm run dev:all</code> open:</p>
        <p><a href="http://127.0.0.1:5173" target="_blank" rel="noopener">http://127.0.0.1:5173</a></p>
      </article>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
