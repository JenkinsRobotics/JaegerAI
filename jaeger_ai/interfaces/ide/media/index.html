<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; img-src https: data: blob: {{CSP}};">
<link rel="stylesheet" href="{{CSS}}"><link rel="stylesheet" href="{{MOTION}}"><title>Jaeger</title></head>
<body>
<header class="app-header">
  <button id="back" class="icon-button" title="Back to chats" aria-label="Back to chats">←</button>
  <span id="chat-heading" class="app-name">Chats</span>
  <div class="header-actions">
    <button id="refresh" class="icon-button" title="Reload chats" aria-label="Reload chats">↻</button>
    <button id="settings" class="icon-button" title="Settings" aria-label="Settings">⚙</button>
    <button id="new" class="icon-button compose-button" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M16 3l5 5M10 14l-1 4 4-1L22 8a2 2 0 0 0-5-5Z"/></svg></button>
  </div>
</header>
<div id="session-tabs" role="tablist" aria-label="Open conversations"></div>
<section id="chat-home" class="chat-home" aria-label="Chats">
  <h1>Chats</h1>
  <input id="chat-search" class="chat-search" type="search" placeholder="Search chats" aria-label="Search chats">
  <div id="chat-list" class="chat-list"></div>
</section>
<div id="status" role="status" aria-live="polite"></div>
<div id="error" role="alert" hidden></div>
<div id="copied" role="status" class="sr-only" aria-live="polite"></div>
<img id="logo-source" class="sr-only" src="{{LOGO}}" alt="">
<main id="timeline" aria-label="Conversation timeline">
  <section class="empty" aria-label="Start a chat"><img src="{{LOGO}}" alt=""><span>Jaeger</span></section>
</main>
<section id="background-tasks" aria-label="Background work" hidden></section>
<section id="changes" aria-label="Workspace changes" hidden></section>
<section id="info" aria-label="Command result" hidden></section>
<div id="approvals" aria-label="Pending approvals"></div>
  <section id="queue" aria-label="Queued work" hidden></section>
<footer>
  <div id="staged" aria-label="Attached files"></div>
  <div id="context-chips" aria-label="IDE context"></div>
  <div id="slash-menu" role="listbox" aria-label="Commands" hidden></div>
  <form id="composer">
    <label class="sr-only" for="prompt">Message Jaeger</label>
    <textarea id="prompt" placeholder="Ask Jaeger anything, or type / for commands" rows="2" aria-autocomplete="list" aria-controls="slash-menu"></textarea>
    <div class="composer-bar">
      <div class="bar-left">
        <button id="attach" class="bar-icon" type="button" title="Add files" aria-label="Add files"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="mention" class="bar-icon" type="button" title="Mention a file" aria-label="Mention a file">@</button>
        <div id="mode-switch" role="radiogroup" aria-label="Mode">
          <button id="mode-plan" class="mode-option" data-mode="plan" role="radio" aria-checked="false" title="Plan this turn; read files and generate a blueprint only"><span>Plan</span></button>
          <button id="mode-auto" class="mode-option" data-mode="auto" role="radio" aria-checked="false" title="Full autonomy; tool calls and edits run without prompts"><span>Auto</span></button>
          <button id="mode-manual" class="mode-option" data-mode="manual" role="radio" aria-checked="false" title="Gated safety mode; approve each file or shell action"><span>Manual</span></button>
        </div>
      </div>
      <div class="bar-right">
        <button id="model-trigger" class="pill model-pill" type="button" aria-haspopup="dialog" title="Choose model"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg><span class="sr-only">Model</span><span id="model-display">Gateway default</span><svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="ide-context" class="pill toggle" type="button" aria-pressed="true" title="Include your open file, selection and tabs with each message"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6-6-15Z"/></svg><span>IDE context</span></button>
        <button id="workspace" class="pill workspace" type="button" title="Choose the workspace Jaeger should use"><span id="workspace-label">Workspace</span></button>
        <button id="worktree" class="pill worktree" type="button" title="Select an existing git worktree"><span>Worktree</span></button>
        <button id="queue-next" class="pill queue-action" type="button" hidden title="Queue this message after the current turn"><span>Queue next</span></button>
        <button id="stop" type="button" hidden>Stop</button>
        <button id="send" class="send-button" type="submit" disabled aria-label="Send message" title="Send message"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
  </form>
  <div class="workspace" title="Current workspace"><span class="workspace-icon">▱</span><span id="context">Work locally</span><span>⌄</span></div>
  <dialog id="model-menu" aria-label="Choose model">
    <div class="model-menu-header">
      <input type="search" id="model-search" placeholder="Search models…" aria-label="Search models">
      <button type="button" id="model-menu-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="model-list" id="model-list" role="listbox" aria-label="Models"></div>
  </dialog>
</footer>
<script type="module" nonce="{{NONCE}}">
  try { window.smd = await import('{{SMD}}'); }
  catch { window.smd = null; }
</script>
<script nonce="{{NONCE}}" src="{{FRAME_QUEUE}}"></script>
<script nonce="{{NONCE}}" src="{{TIMELINE}}"></script>
<script nonce="{{NONCE}}" src="{{KEYED_RENDERER}}"></script>
<script nonce="{{NONCE}}" src="{{PRESENTATION}}"></script>
<script nonce="{{NONCE}}" src="{{DURATION}}"></script>
<script nonce="{{NONCE}}" src="{{SLASH}}"></script>
<script nonce="{{NONCE}}" src="{{MARKDOWN}}"></script>
<script nonce="{{NONCE}}" src="{{JS}}"></script>
</body></html>
