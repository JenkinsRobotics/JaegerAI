<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JaegerAI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside>
    <div class="brand"><span class="mark">J</span><div><strong id="agentName">JaegerAI</strong><small>autonomous agent</small></div></div>
    <button id="newChat">＋ New conversation</button>
    <div class="section-label">Conversations</div>
    <div id="sessions" class="sessions"></div>
    <div class="runtime"><span id="healthDot"></span><div><strong id="runtimeState">Connecting</strong><small id="modelName">Checking runtime…</small></div></div>
  </aside>
  <main>
    <header><div><strong id="title">New conversation</strong><small>Jaeger-owned session · ARES-derived interface</small></div><div class="pill">Mac Ollama</div></header>
    <section id="messages" class="messages"><div class="welcome"><div class="orb">J</div><h1>JaegerAI</h1><p>Your independent autonomous agent. Sessions, tools, memory, and schedules remain owned by Jaeger.</p></div></section>
    <form id="composer"><textarea id="prompt" rows="1" placeholder="Message Jaeger…"></textarea><button type="submit" aria-label="Send">↑</button></form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
