name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/jaeger-release-pycache

jobs:
  qualification:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish Qualified Release
    needs: [qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require immutable version tag matching package version
        run: |
          python3 - <<'PYTHON'
          import ast, os, subprocess
          from pathlib import Path
          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Select a version tag to release; branches cannot be published')
          tree = ast.parse(Path('jaeger_ai/__init__.py').read_text(encoding='utf-8'))
          version = next(
              ast.literal_eval(n.value)
              for n in tree.body
              if isinstance(n, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)
          )
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit(f"Release tag {os.environ['GITHUB_REF_NAME']!r} must match package version v{version}")
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', os.environ['GITHUB_REF'] + '^{commit}'], text=True).strip()
          if head != tagged:
              raise SystemExit('Checkout differs from release tag')
          PYTHON

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build and verify distribution artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir "$RUNNER_TEMP/jaeger-dist" .
          python -m twine check "$RUNNER_TEMP"/jaeger-dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ runner.temp }}/jaeger-dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
