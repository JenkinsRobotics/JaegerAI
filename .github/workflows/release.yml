name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.13.0)'
        required: true
        default: '0.13.0'

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  release:
    name: Create Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jaeger_ai/interfaces/ui/package-lock.json

      - name: Install dependencies
        run: |
          pip install -e .
          pip install build twine

      - name: Build frontend
        working-directory: jaeger_ai/interfaces/ui
        run: |
          npm ci
          npm run build

      - name: Build Python package
        run: |
          python -m build

      - name: Build IDE extension
        working-directory: jaeger_ai/interfaces/ide
        run: |
          npm ci || true
          # Package VSIX if vsce is available
          npx --yes @vscode/vsce package --no-dependencies || echo "VSIX packaging skipped"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            jaeger_ai/interfaces/ui/dist/**
            jaeger_ai/interfaces/ide/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
