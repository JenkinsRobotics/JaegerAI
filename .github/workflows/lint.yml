name: Static analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Run critical Python checks
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 .

  eslint:
    name: ESLint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: jaeger_ai/interfaces/ui/package-lock.json
      - name: Install dependencies
        working-directory: jaeger_ai/interfaces/ui
        run: npm ci
      - name: Type check
        working-directory: jaeger_ai/interfaces/ui
        run: npm run typecheck
