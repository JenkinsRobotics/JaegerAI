name: CI

on:
  push:
    branches: [main, master, v1]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'jaeger-os @ git+https://github.com/JenkinsRobotics/JaegerOS@master'
          pip install -e .[dev]

      - name: Lint
        run: ruff check

      - name: Module-contract smoke test
        run: pytest -v
