name: JaegerAI CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaeger-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAEGER_NO_ATTACH: "1"
  JAEGER_TEST_HEADLESS: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/jaeger-ci-pycache

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aiohttp>=3.10" "httpx>=0.27" "mcp>=1.0" "pydantic>=2.7" "pyyaml>=6.0" pytest pytest-asyncio
      - name: Run standalone package, layering, E2E, and hygiene tests
        run: |
          STANDALONE_SRC_PATHS="packages/jaeger-contracts/src:packages/jaeger-models/src:packages/jaeger-tools/src:packages/jaeger-loop/src:packages/jaeger-memory/src:packages/jaeger-authority/src:packages/jaeger-orchestration/src:packages/jaeger-reliability/src:packages/jaeger-events/src:packages/jaeger-gateway/src:packages/jaeger-mcp/src:packages/jaeger-macos/src:packages/jaeger-lsp/src:packages/jaeger-checkpoints/src:packages/jaeger-skills/src:packages/jaeger-cognition/src:packages/jaeger-avatar/src:packages/jaeger-business/src:packages/jaeger-youtube/src:packages/jaeger-channels/src:packages/jaeger-embodiment-minecraft/src:packages/jaeger-hardware/src:packages/jaeger-droid/src:packages/jaeger-realtime/src:packages/jaeger-vision/src:packages/jaeger-evals/src:packages/jaeger-protocols/src"
          PYTHONPATH="${STANDALONE_SRC_PATHS}:." python -B -m pytest -q --no-header -p no:cacheprovider \
            packages/jaeger-contracts/tests \
            packages/jaeger-models/tests \
            packages/jaeger-tools/tests \
            packages/jaeger-loop/tests \
            packages/jaeger-memory/tests \
            packages/jaeger-authority/tests \
            packages/jaeger-orchestration/tests \
            packages/jaeger-reliability/tests \
            packages/jaeger-events/tests \
            packages/jaeger-gateway/tests \
            packages/jaeger-mcp/tests \
            packages/jaeger-macos/tests \
            packages/jaeger-lsp/tests \
            packages/jaeger-checkpoints/tests \
            packages/jaeger-skills/tests \
            packages/jaeger-cognition/tests \
            packages/jaeger-avatar/tests \
            packages/jaeger-business/tests \
            packages/jaeger-youtube/tests \
            packages/jaeger-channels/tests \
            packages/jaeger-embodiment-minecraft/tests \
            packages/jaeger-hardware/tests \
            packages/jaeger-droid/tests \
            packages/jaeger-realtime/tests \
            packages/jaeger-vision/tests \
            packages/jaeger-evals/tests \
            packages/jaeger-protocols/tests \
            dev/tests
      - name: Check shell scripts and zero runtime junk
        run: |
          bash -n install.sh jaeger scripts/*.sh
          junk="$(git status --porcelain --ignored | grep -E '__pycache__|\.pytest_cache|\.jaeger_ai|\.jaeger_agent|jaeger_ai/interfaces/ui/dist' || true)"
          if [ -n "$junk" ]; then echo "$junk"; exit 1; fi

  frontend:
    name: Frontend (@jaeger/ui-* & External Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: jaeger_ai/interfaces/ui/package-lock.json
      - name: Install UI dependencies
        working-directory: jaeger_ai/interfaces/ui
        run: npm ci
      - name: Run frontend unit tests
        working-directory: jaeger_ai/interfaces/ui
        run: npm run test
      - name: Build production UI into external cache (theme + tsc + vite + no-mock)
        run: |
          JAEGER_UI_DEPENDENCIES="${PWD}/jaeger_ai/interfaces/ui" \
            python3 jaeger_ai/interfaces/ui/scripts/build-external.py
          test ! -d jaeger_ai/interfaces/ui/dist

  macos-shell:
    name: Native macOS Shell
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and test JaegerShellCore
        run: |
          swift test --package-path jaeger_ai/interfaces/macos-shell \
            --scratch-path "$RUNNER_TEMP/macos-shell-build"

  distribution:
    name: Build & Validate Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/jaeger-dist" .
          python -m twine check "$RUNNER_TEMP"/jaeger-dist/*
