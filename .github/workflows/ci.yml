name: JaegerAI CI
on: [push, pull_request]
permissions:
  contents: read
env:
  JAEGER_NO_ATTACH: "1"
  JAEGER_TEST_HEADLESS: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  webui-assembly:
    name: First-party Jaeger WebUI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check integrated WebUI source and Python syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/jaeger-ci-pycache
        run: |
          python - <<'PY'
          import compileall
          from pathlib import Path
          root = Path('jaeger_ai/features/webui')
          required = (root/'server.py', root/'api/routes.py', root/'static/index.html')
          if not all(path.is_file() for path in required):
              raise SystemExit('Integrated WebUI source is incomplete')
          if not compileall.compile_dir(root / 'api', quiet=1):
              raise SystemExit('Integrated WebUI has invalid Python syntax')
          PY
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        suite: [root, agent, os, kokoro, whisper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux sandbox and desktop runtimes
        if: matrix.suite == 'root'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libegl1 libgl1 libopengl0 libxkbcommon0 libportaudio2 libpulse0 libsndfile1
          # Ubuntu 24.04's hosted-runner AppArmor policy blocks the user and
          # network namespaces that Bubblewrap needs. This VM is disposable;
          # production hosts should use a targeted AppArmor profile instead.
          for key in \
            kernel.apparmor_restrict_unprivileged_unconfined \
            kernel.apparmor_restrict_unprivileged_userns
          do
            if sysctl "$key" >/dev/null 2>&1; then
              sudo sysctl -w "$key=0"
            fi
          done
      - name: Install suite
        run: |
          # Keep the packaging toolchain on a patched release. setuptools is
          # installed in the runner environment and is therefore audited even
          # though it is only a build dependency of Jaeger.
          python -m pip install --upgrade pip "setuptools>=83"
          case "${{ matrix.suite }}" in
            root) python scripts/install-packages.py packages/jaeger-os 'packages/jaeger-agent[multimodal-duplex]' packages/jaeger-kokoro-tts packages/jaeger-whisper-stt '.[test]' ;;
            agent) python scripts/install-packages.py packages/jaeger-os packages/jaeger-agent; python -m pip install pytest onnxruntime ;;
            os) python scripts/install-packages.py packages/jaeger-os; python -m pip install pytest ;;
            kokoro) python scripts/install-packages.py packages/jaeger-os packages/jaeger-kokoro-tts; python -m pip install pytest ;;
            whisper) python scripts/install-packages.py packages/jaeger-os packages/jaeger-whisper-stt; python -m pip install pytest ;;
          esac
      - name: Test suite
        run: |
          case "${{ matrix.suite }}" in
            root) python -m pytest dev/tests -q ;;
            agent) python -m pytest packages/jaeger-agent/tests -q ;;
            os) cd packages/jaeger-os && python -m pytest dev/tests -q ;;
            kokoro) cd packages/jaeger-kokoro-tts && python -m pytest -q ;;
            whisper) cd packages/jaeger-whisper-stt && python -m pytest -q ;;
          esac
      - name: Critical static and dependency security gates
        if: matrix.suite == 'root' && matrix.python == '3.11'
        run: |
          python -m pip install ruff pip-audit
          ruff check --select E9,F63,F7,F82 .
          # PYSEC-2026-2447 has no patched release. Jaeger does not create
          # llama_cpp.LlamaDiskCache; see SECURITY.md for the threat model.
          pip-audit --local --skip-editable --ignore-vuln PYSEC-2026-2447
  swift:
    name: Native Swift
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test native app
        working-directory: jaeger_ai/interfaces/swift
        run: swift test --scratch-path "$RUNNER_TEMP/jaeger-swift-build"
  release-artifacts:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build
      - name: Build distributions from clean checkout
        run: |
          python scripts/install-packages.py --no-install --sdist --wheel-dir "$RUNNER_TEMP/jaeger-dist" \
            packages/jaeger-os packages/jaeger-agent packages/jaeger-kokoro-tts packages/jaeger-whisper-stt .
      - name: Reject unsafe artifact contents
        run: python dev/scripts/inspect_release_artifacts.py "$RUNNER_TEMP/jaeger-dist"
      - name: Installer and test-runner syntax
        run: bash -n install.sh scripts/*.sh dev/scripts/*.sh
