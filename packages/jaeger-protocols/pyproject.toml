[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-protocols"
version = "0.1.0"
description = "AG-UI, A2UI, and ACP protocol adapters for external editors and surfaces"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
