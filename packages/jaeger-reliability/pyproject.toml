[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-reliability"
version = "0.1.0"
description = "Error classification, credential pool failover, zero-event retries, schema argument repair, and stuck-loop watchdog."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
