[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-gateway"
version = "0.1.0"
description = "Standalone single-fiber Gateway server, zombie-fenced SSE streams, WAL session/approval store & fail-closed WS/HTTP auth."
requires-python = ">=3.11"
dependencies = [
    "jaeger-contracts",
    "jaeger-events",
]

[tool.setuptools.packages.find]
where = ["src"]
