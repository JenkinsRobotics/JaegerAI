[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-lsp"
version = "0.1.0"
description = "Fast post-edit syntax, type, and lint diagnostics for Python, JSON, JS/TS, and Swift."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
