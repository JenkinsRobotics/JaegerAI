[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-checkpoints"
version = "0.1.0"
description = "Shadow-Git workspace checkpoints, diffs, and instant 1-step rollback without touching user .git."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
