[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-authority"
version = "0.1.0"
description = "Standalone composable fail-closed PolicyEngine and OS/container SandboxPort backends for JaegerAI."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jaeger_authority = ["*.sbpl"]
