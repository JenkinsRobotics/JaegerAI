[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-macos"
version = "0.1.0"
description = "Pure macOS OS adapter library: cross-process AppleEvents serializer, Mail.app/PIM AppleScript builders, iMessage typedstream/send helpers, and TCC diagnostics."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
