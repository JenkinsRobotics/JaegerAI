[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-orchestration"
version = "0.1.0"
description = "Subagent orchestration with spawn permission intersection, eviction-safe SQLite mailboxes, HubArbiter, and CronScheduler."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts", "jaeger-events", "jaeger-loop"]

[tool.setuptools.packages.find]
where = ["src"]
