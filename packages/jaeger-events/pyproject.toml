[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-events"
version = "0.1.0"
description = "Replay-safe typed EventBus, frame-aligned StreamingDeltaBatcher, and non-blocking OTLP TelemetryEmitter."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
