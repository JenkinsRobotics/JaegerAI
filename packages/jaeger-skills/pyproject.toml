[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-skills"
version = "0.1.0"
description = "Standalone skill frontmatter parser, validator, versioned history store, and keyword ranker."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
