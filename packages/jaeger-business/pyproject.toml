[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-business"
version = "0.1.0"
description = "Autonomous multi-role business team, budgets, SOP playbooks, and approval gates (SQLite WAL)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
