[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-realtime"
version = "0.1.0"
description = "24/7 voice presence, ambient <ignore>/<reply> speech gate, and barge-in cascade"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
