[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-memory"
version = "0.1.0"
description = "SQLite checkpoints & memory, disk tool-output offloading, pure context assembly, tiered compaction, and isolated git snapshots."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
