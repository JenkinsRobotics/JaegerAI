[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-evals"
version = "0.1.0"
description = "SpanTree agentic trajectory evaluators (pydantic-ai) and compaction verifier (AG2)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
