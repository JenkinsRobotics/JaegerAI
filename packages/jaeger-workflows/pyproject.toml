[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-workflows"
version = "0.1.0"
description = "Durable SQLite-checkpointed workflow DAG engine with pause/resume and approval gates."
requires-python = ">=3.11"
dependencies = ["jaeger-contracts"]

[tool.setuptools.packages.find]
where = ["src"]
