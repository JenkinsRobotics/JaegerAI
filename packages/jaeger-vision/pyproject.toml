[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-vision"
version = "0.1.0"
description = "24/7 camera awareness with hard rolling-frame RAM pruning for 32 GB systems"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
