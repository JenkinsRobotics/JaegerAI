[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-channels"
version = "0.1.0"
description = "Standalone multi-channel notification & messaging relay (SQLite WAL outbox with secret redaction)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
