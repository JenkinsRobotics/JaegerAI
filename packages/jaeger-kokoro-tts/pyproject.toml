# JaegerKokoroTTS — packaging + dev-tooling config.
#
# Split out of the JROS monorepo (0.9 four-way split): the tts-slot
# engine module. The module IS the engine (see
# jaeger_kokoro_tts/__init__.py). Two real consumers
# (JaegerAI product + JP01 non-AI console) triggered the graduation to
# its own repo (THREE_TIER_STRUCTURE.md's split triggers). Pins
# jaeger-os ONLY — never jaeger-ai — a robot must be able to speak
# without the AI product installed.
#
# Installs editable (PEP 660), same model as jaeger-os/jaeger-ai.
# Version single-sourced from jaeger_kokoro_tts/__init__.py; runtime
# deps single-sourced from requirements.txt.

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-kokoro-tts"
description = "JaegerKokoroTTS — the tts-slot engine module for the Jaeger ecosystem (Kokoro TTS engine + generic TTSNode/Synthesizer contract)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["version", "dependencies"]

[project.scripts]
# Standalone dev/demo driver — `speak`, `save`, `voices`, `devices`,
# `bench`. Lets the module be exercised without an app around it;
# see jaeger_kokoro_tts/cli.py.
jaeger-kokoro-tts = "jaeger_kokoro_tts.cli:main"

[project.entry-points."jaeger_os.module_roots"]
# The out-of-tree discover_modules() seam (0.9 step 4 split) — see
# jaeger_kokoro_tts/module_roots.py. JaegerOS finds this WITHOUT ever
# naming jaeger_kokoro_tts; it only knows the group.
jaeger_kokoro_tts = "jaeger_kokoro_tts.module_roots:roots"

[tool.setuptools.dynamic]
version = {attr = "jaeger_kokoro_tts.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["jaeger_kokoro_tts*"]
# Tests are not part of the distribution. They are also the largest
# source of generated __pycache__, so excluding them keeps bytecode out
# of the wheel for free.
exclude = ["jaeger_kokoro_tts.tests*", "jaeger_kokoro_tts*.__pycache__*"]

[tool.setuptools.package-data]
# module.yaml is not a .py file, so setuptools does NOT pick it up
# automatically — it ships only because this line says so. An editable
# install masks its absence completely: the import path points back at
# the source tree, so the manifest "works" by accident and every local
# test passes. The failure appears only in a REAL install (`pip install
# jaeger-kokoro-tts @ git+...`), where the module imports fine, claims no
# slot, and the app boots one node short with no error.
#
# ALLOWLIST, not a recursive glob. This was `["**/*"]` plus an
# exclude-package-data block undoing it; the glob swept __pycache__ into
# the wheel — measured at 12 .pyc files including pytest-versioned test
# bytecode. A .pyc whose .py no longer matches is still importable, so
# that is a stale-code hazard, not just weight. Naming the assets is
# shorter than sweeping and then subtracting, and it makes the artifact
# reproducible. Add real assets here as the module grows them.
jaeger_kokoro_tts = ["module.yaml"]

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
# One location. `dev/tests` went away in the 0.12.0 flattening —
# leaving it here made pytest silently collect nothing from a path
# that no longer exists, which is how a deleted suite stays deleted.
testpaths = ["jaeger_kokoro_tts/tests"]
markers = [
    "slow: tests that fork real processes or do real network I/O.",
    "model: tests that load the real Kokoro model weights.",
]

[project.optional-dependencies]
# For a machine with NO framework installed. JaegerOS is not on PyPI,
# so `jaeger-os>=0.10` alone cannot resolve from nothing.
#
# Kept OPTIONAL on purpose: a URL dependency forces pip to reinstall
# that exact source even when a newer, satisfying jaeger-os is already
# present. As a normal dependency that silently downgrades the
# framework under a running app. As an extra, you only get it when you
# ASK for it, which is exactly when you have nothing to lose.
#
#   pip install -e .              framework already present
#   pip install -e ".[bootstrap]" fresh machine
bootstrap = [
  "jaeger-os @ git+https://github.com/JenkinsRobotics/JaegerOS@master",
]
