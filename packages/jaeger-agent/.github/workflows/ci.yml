name: CI

on:
  push:
    branches: [main, master, v1]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'jaeger-os @ git+https://github.com/JenkinsRobotics/JaegerOS@master'
          pip install -e .[dev]

      - name: Lint
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          changed_python_files="$(git diff --name-only --diff-filter=ACMRT "origin/${BASE_REF}...HEAD" -- '*.py')"
          if [[ -n "${changed_python_files}" ]]; then
            ruff check ${changed_python_files}
          else
            echo "No changed Python files to lint."
          fi

      - name: Module-contract smoke test
        run: pytest -v
