[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-agent"
description = "Reusable agent runtime with model adapters, tools, skills, memory, automation, delegation, and headless operation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["version"]
# llama-cpp-python is a BASE dependency, not an extra, because
# `provider = "llama_cpp"` is the default: a robot that pip-installs
# this module gets a brain that runs on its own hardware with no
# server, no account and no network. Matching JaegerAI, which has
# carried the same hard dependency since before the split — the module
# should not be less capable out of the box than the app it came from.
#
# jinja2 rides along because local chat templates are Jinja.
dependencies = [
    "jaeger-os>=0.9.0",
    "llama-cpp-python>=0.3",
    "jinja2>=3.1",
    # Scheduling is a base capability, not a backend: memory.add_schedule
    # and the due-claim sweep both import croniter unconditionally, so a
    # bare `pip install jaeger-agent` that lacked it shipped a scheduler
    # that raised ModuleNotFoundError on first use.
    "croniter>=2.0",
]

# Everything else is a REMOTE or alternative backend, and therefore
# genuinely optional — you only pay for the wire you use.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# The `openai` package is an HTTP client for a WIRE FORMAT, not a cloud
# account: LM Studio, Ollama, llama.cpp's server and vLLM all speak it.
openai = ["openai>=1.0"]
# Kept as a no-op alias so `jaeger-agent[local]` still resolves for
# anyone who pinned it before llama.cpp became the default.
local = []
mlx = ["mlx-lm>=0.21", "mlx-vlm>=0.1"]

# ── capability extras ──────────────────────────────────────────────
# Tools that need heavy or platform-specific wheels. Each import site is
# guarded, so a missing extra degrades that ONE tool instead of breaking
# the install — but until 1.0.9 none of them were written down, so the
# only way to learn what `look_at` or `search_memory` needed was to call
# it and read the traceback.
#
# Anything a CORE tool needs is a real dependency above, not an extra.

# Semantic memory: search_memory's embeddings + the sqlite vector store.
# Without it, recall by exact key still works and search_memory does not.
embeddings = ["sentence-transformers>=3", "sqlite-vec>=0.1", "numpy>=1.26"]

# look_at / ocr_image — a local VLM.
vision = ["torch>=2", "transformers>=4.40", "pillow>=10", "numpy>=1.26"]

# Image generation (the media toolset).
image_gen = ["diffusers>=0.30", "torch>=2", "pillow>=10"]

# The verified VoiceLLM-derived perception/speech pipeline.  These remain
# optional because the implementation is lazy: a headless text agent must not
# import or install neural audio runtimes merely to use the agent loop.
multimodal = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pywhispercpp>=1.2",
    "kokoro>=0.9.4",
    # Misaki English needs this model at startup; install it with the extra
    # instead of attempting a package download in the audio worker thread.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    "onnxruntime>=1.17",
]

# Compatibility alias retained for callers that previously requested
# ``jaeger-agent[audio]``.  It now installs the complete half-duplex stack.
audio = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pywhispercpp>=1.2",
    "kokoro>=0.9.4",
    # Misaki English needs this model at startup; install it with the extra
    # instead of attempting a package download in the audio worker thread.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    "onnxruntime>=1.17",
]

# Quasi/full audio additionally need Speex AEC.  Extras cannot depend on
# another extra in core metadata, so the complete list is repeated here.
multimodal-duplex = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pywhispercpp>=1.2",
    "kokoro>=0.9.4",
    # Misaki English needs this model at startup; install it with the extra
    # instead of attempting a package download in the audio worker thread.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    "onnxruntime>=1.17",
    "pyaec>=1.0.1",
]

# browse_page — a real browser engine.
browser = ["playwright>=1.44"]

# ocr_screen on macOS, via the system Vision framework.
ocr_macos = ["pyobjc-framework-Vision>=10", "pyobjc-framework-Quartz>=10",
             "pyobjc-framework-Cocoa>=10"]

# The DuckDuckGo search backends. web_search still works without them —
# the backend chain falls through to the HTML and Wikipedia backends,
# which is why these are optional and requests is not.
search = ["ddgs>=6", "duckduckgo-search>=6"]  # ddgs is the current name; the legacy
                                          # package stays for the fallback backend

dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.4"]

[project.entry-points."jaeger_os.module_roots"]
jaeger_agent = "jaeger_agent.core.module_roots:roots"

[tool.setuptools.dynamic]
version = {attr = "jaeger_agent.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["jaeger_agent*"]
# Skill and node resource trees are valid PEP 420 namespace packages.  Keep
# namespace discovery while excluding local interpreter-cache packages.
exclude = ["jaeger_agent*.__pycache__", "jaeger_agent*.__pycache__.*"]

[tool.setuptools.package-data]
# Runtime data must ship in non-editable installs. Keep explicit resource
# patterns so bytecode, databases, logs and build residue cannot enter a wheel.
# Installed-package asset tests guard the prompts, skills, nodes and manifests.
jaeger_agent = [
    "skills/**/*.md", "skills/**/*.yaml", "skills/**/*.yml",
    "skills/**/*.json", "skills/**/*.xsd", "skills/**/*.sty",
    "skills/**/*.tex", "skills/**/*.bst", "skills/**/*.bib",
    "skills/**/*.pdf", "skills/**/*.html", "skills/**/*.txt",
    "skills/**/*.js", "skills/**/*.ini", "skills/**/*.sh",
    "skills/**/LICENSE", "skills/**/Makefile",
    "module.yaml", "prompts/**/*.md", "prompts/**/*.yaml", "background/*.yaml",
    "nodes/*/node.json", "nodes/*/weights/*.md", "nodes/*/stats/*.md",
    "assets/silero/*.onnx", "assets/silero/*.txt", "assets/silero/*.md",
]

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
