# JaegerWhisperSTT — packaging + dev-tooling config.
#
# Split out of the JROS monorepo (0.9 four-way split): the stt-slot
# engine module. The module IS the engine (see
# jaeger_whisper_stt/__init__.py). Two real consumers
# (JaegerAI product + JP01 non-AI console) triggered the graduation to
# its own repo (THREE_TIER_STRUCTURE.md's split triggers). Pins
# jaeger-os ONLY — never jaeger-ai — a robot must be able to listen
# without the AI product installed.
#
# Installs editable (PEP 660), same model as jaeger-os/jaeger-ai.
# Version single-sourced from jaeger_whisper_stt/__init__.py; runtime
# deps single-sourced from requirements.txt.

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-whisper-stt"
description = "JaegerWhisperSTT — the stt-slot engine module for the Jaeger ecosystem (pywhispercpp-backed Whisper engine + AudioSessionNode contract)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["version", "dependencies"]

[project.scripts]
# Standalone dev/demo driver — `list`, `devices`, `doctor`, `run <method>`,
# `bench`, and `transcribe`. Lets the module be exercised without an app;
# see jaeger_whisper_stt/cli.py.
jaeger-whisper-stt = "jaeger_whisper_stt.cli:main"

[project.entry-points."jaeger_os.module_roots"]
# The out-of-tree discover_modules() seam (0.9 step 4 split) — see
# jaeger_whisper_stt/module_roots.py. JaegerOS finds this WITHOUT ever
# naming jaeger_whisper_stt; it only knows the group.
jaeger_whisper_stt = "jaeger_whisper_stt.module_roots:roots"

[tool.setuptools.dynamic]
version = {attr = "jaeger_whisper_stt.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
# Release contents are controlled by the explicit package-data allowlist below.
# Otherwise setuptools can reuse entries from an existing egg-info/SOURCES.txt
# and accidentally ship local tests or generated bytecode.
include-package-data = false

[tool.setuptools.packages.find]
include = ["jaeger_whisper_stt*"]
exclude = ["jaeger_whisper_stt.tests*", "jaeger_whisper_stt*.__pycache__*"]

[tool.setuptools.package-data]
# Keep this allowlist explicit. A recursive glob also captures local test
# sources and generated __pycache__ files when they happen to exist in the
# source tree, producing a larger and non-reproducible release artifact.
jaeger_whisper_stt = ["module.yaml"]

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
testpaths = ["jaeger_whisper_stt/tests"]
markers = [
    "slow: tests that fork real processes or do real network I/O.",
    "model: tests that load the real Whisper model weights.",
]

[project.optional-dependencies]
# For a machine with NO framework installed. JaegerOS is not on PyPI,
# so `jaeger-os>=0.10` alone cannot resolve from nothing.
#
# Kept OPTIONAL on purpose: a URL dependency forces pip to reinstall
# that exact source even when a newer, satisfying jaeger-os is already
# present. As a normal dependency that silently downgrades the
# framework under a running app. As an extra, you only get it when you
# ASK for it, which is exactly when you have nothing to lose.
#
#   pip install -e .              framework already present
#   pip install -e ".[bootstrap]" fresh machine
bootstrap = [
  "jaeger-os @ git+https://github.com/JenkinsRobotics/JaegerOS@master",
]
