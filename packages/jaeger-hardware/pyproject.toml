[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaeger-hardware"
version = "0.1.0"
description = "JP01 robotics hardware protocol, L2 E-Stop latch, and physical droid EmbodimentPort"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
