[pytest]
# Test discovery
testpaths = dev/tests/unit dev/tests/integration dev/tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast)
    integration: Integration tests (medium)
    e2e: End-to-end tests (slow, requires full stack)
    slow: Slow tests (>5 seconds)
    requires_gateway: Requires running Gateway on :33418
    requires_webui: Requires running WebUI on :8790
    requires_mobile: Requires mobile node server
    swift: Swift/Xcode tests
    frontend: Frontend/React tests

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Timeouts
timeout = 300
timeout_method = thread

# Coverage (enabled via command line: --cov=jaeger_ai --cov-report=term-missing)
# Disabled by default to avoid conflicts; CI enables coverage explicitly.
# --cov=jaeger_ai
# --cov-report=term-missing
# --cov-report=html:htmlcov
# --cov-fail-under=70

# Async
asyncio_mode = auto

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
